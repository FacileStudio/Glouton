<!doctype html>
<html lang="%lang%">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <title>Glouton · Find new clients while you sleep</title>
    <meta name="description" content="Crawls the web, detects the technical stack of each site and qualifies leads for the studio." />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#fafafa" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0a0a0a" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Facile" />
    <meta property="og:locale" content="en_US" />
    <meta property="og:url" content="https://glouton.facile.studio/" />
    <meta property="og:title" content="Glouton · Find new clients while you sleep" />
    <meta property="og:description" content="Crawls the web, detects the technical stack of each site and qualifies leads for the studio." />
    <meta property="og:image" content="https://glouton.facile.studio/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Glouton: Find new clients while you sleep" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Glouton · Find new clients while you sleep" />
    <meta name="twitter:description" content="Crawls the web, detects the technical stack of each site and qualifies leads for the studio." />
    <meta name="twitter:image" content="https://glouton.facile.studio/og-image.png" />

    <script>
      (function () {
        try {
          var stored = localStorage.getItem('glouton.theme');
          var root = document.documentElement;
          root.classList.toggle('dark', stored === 'dark');
          root.classList.toggle('light', stored === 'light');
        } catch (e) {}
      })();
    </script>

    <meta name="color-scheme" content="light dark" />

    %sveltekit.head%

  </head>
  <body data-sveltekit-preload-data="hover">
    <div style="display: contents">%sveltekit.body%</div>
  </body>
</html>
