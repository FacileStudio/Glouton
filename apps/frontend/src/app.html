<!doctype html>
<html lang="%lang%">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <link rel="icon" href="%sveltekit.assets%/favicon.svg" type="image/svg+xml" />
    <link rel="alternate icon" href="%sveltekit.assets%/favicon.ico" sizes="any" />
    <link rel="apple-touch-icon" href="%sveltekit.assets%/apple-touch-icon.png" />
    <link rel="manifest" href="%sveltekit.assets%/site.webmanifest" />

    <script>
      (function () {
        try {
          var stored = localStorage.getItem('glouton.theme');
          var root = document.documentElement;
          root.classList.toggle('dark', stored === 'dark');
          root.classList.toggle('light', stored === 'light');
        } catch (e) {}
      })();
    </script>

    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#ffffff" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0a0a0a" />

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Glouton" />
    <meta property="og:url" content="https://glouton.facile.studio/" />
    <meta property="og:title" content="Glouton — Génération de leads" />
    <meta
      property="og:description"
      content="Génération de leads auto-hébergée : trouvez des entreprises locales, auditez leurs sites, notez-les et lancez vos campagnes d'emailing."
    />
    <meta property="og:image" content="https://glouton.facile.studio/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Glouton — Génération de leads" />
    <meta
      name="twitter:description"
      content="Génération de leads auto-hébergée : trouvez des entreprises locales, auditez leurs sites, notez-les et lancez vos campagnes d'emailing."
    />
    <meta name="twitter:image" content="https://glouton.facile.studio/og-image.png" />

    %sveltekit.head%

    <title>Glouton — Génération de leads</title>
    <meta
      name="description"
      content="Génération de leads auto-hébergée : trouvez des entreprises locales, auditez leurs sites, notez-les et lancez vos campagnes d'emailing."
    />
  </head>
  <body data-sveltekit-preload-data="hover">
    <div style="display: contents">%sveltekit.body%</div>
  </body>
</html>
