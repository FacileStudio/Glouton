services:
  glouton-postgres:
    image: postgres:16-alpine
    container_name: glouton-postgres
    environment:
      POSTGRES_USER: glouton
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-glouton}
      POSTGRES_DB: glouton
    volumes:
    - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
      - CMD
      - nc
      - -z
      - localhost
      - '3000'
      interval: 30s
      timeout: 5s
      retries: 3
    restart: unless-stopped
    deploy:
      update_config:
        order: start-first
        parallelism: 1
      restart_policy:
        condition: any
  glouton-redis:
    image: redis:7-alpine
    container_name: glouton-redis
    command: redis-server --appendonly yes --maxmemory-policy noeviction
    volumes:
    - redis_data:/data
    healthcheck:
      test:
      - CMD
      - nc
      - -z
      - localhost
      - '3000'
      interval: 30s
      timeout: 5s
      retries: 3
    restart: unless-stopped
    deploy:
      update_config:
        order: start-first
        parallelism: 1
      restart_policy:
        condition: any
  glouton-backend:
    build:
      context: .
      dockerfile: apps/backend/Dockerfile
      args:
        DATABASE_URL: postgresql://glouton:${POSTGRES_PASSWORD:-glouton}@glouton-postgres:5432/glouton
        CACHE_BUST: ${CACHE_BUST:-2026-05-15-1}
    container_name: glouton-backend
    environment:
      NODE_ENV: production
      PORT: 3001
      DOMAIN: ${DOMAIN:?Set DOMAIN to your public URL, for example https://glouton.facile.studio}
      DATABASE_URL: postgresql://glouton:${POSTGRES_PASSWORD:-glouton}@glouton-postgres:5432/glouton
      ENCRYPTION_SECRET: ${ENCRYPTION_SECRET:?Set ENCRYPTION_SECRET to a stable random
        value}
      REDIS_HOST: glouton-redis
      REDIS_PORT: 6379
      REDIS_DB: 0
      OIDC_ISSUER: ${OIDC_ISSUER:-}
      OIDC_CLIENT_ID: ${OIDC_CLIENT_ID:-}
      OIDC_CLIENT_SECRET: ${OIDC_CLIENT_SECRET:-}
      OIDC_REDIRECT_URL: ${OIDC_REDIRECT_URL:-}
      OIDC_SUCCESS_URL: ${OIDC_SUCCESS_URL:-}
      SSO_ONLY: ${SSO_ONLY:-}
    depends_on:
      glouton-postgres:
        condition: service_healthy
      glouton-redis:
        condition: service_healthy
    healthcheck:
      test:
      - CMD
      - nc
      - -z
      - localhost
      - '3000'
      interval: 30s
      timeout: 5s
      retries: 3
    restart: unless-stopped
    deploy:
      update_config:
        order: start-first
        parallelism: 1
      restart_policy:
        condition: any
  glouton-frontend:
    build:
      context: .
      dockerfile: apps/frontend/Dockerfile
    container_name: glouton-frontend
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 3000
      DOMAIN: ${DOMAIN:?Set DOMAIN to your public URL, for example https://glouton.facile.studio}
      BACKEND_URL: http://glouton-backend:3001
    expose:
    - '3000'
    depends_on:
      glouton-backend:
        condition: service_healthy
    healthcheck:
      test:
      - CMD
      - nc
      - -z
      - localhost
      - '3000'
      interval: 30s
      timeout: 5s
      retries: 3
    restart: unless-stopped
    deploy:
      update_config:
        order: start-first
        parallelism: 1
      restart_policy:
        condition: any
volumes:
  postgres_data: null
  redis_data: null
