services:
  glouton-postgres:
    image: postgres:16-alpine
    container_name: glouton-postgres
    environment:
      POSTGRES_USER: glouton
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-glouton}
      POSTGRES_DB: glouton
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U glouton -d glouton"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s
      start_interval: 1s
    restart: unless-stopped

  glouton-redis:
    image: redis:7-alpine
    container_name: glouton-redis
    command:
      - sh
      - -c
      - |
        m=/data/appendonlydir/appendonly.aof.manifest
        if [ -f "$$m" ] && ! redis-check-aof "$$m" >/dev/null 2>&1; then
          if ! ls -d /data/appendonlydir.bak-* >/dev/null 2>&1; then
            cp -a /data/appendonlydir "/data/appendonlydir.bak-$$(date +%s)" || exit 1
          fi
          echo y | redis-check-aof --fix "$$m" || exit 1
        fi
        exec docker-entrypoint.sh redis-server --appendonly yes --maxmemory-policy noeviction
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s
      start_interval: 1s
    restart: unless-stopped

  glouton-backend:
    build:
      context: .
      dockerfile: apps/backend/Dockerfile
      args:
        DATABASE_URL: postgresql://glouton:${POSTGRES_PASSWORD:-glouton}@glouton-postgres:5432/glouton
        CACHE_BUST: ${CACHE_BUST:-2026-05-15-1}
    container_name: glouton-backend
    environment:
      NODE_ENV: production
      PORT: 3001
      DOMAIN: ${DOMAIN:?Set DOMAIN to your public URL, for example https://glouton.facile.studio}
      DATABASE_URL: postgresql://glouton:${POSTGRES_PASSWORD:-glouton}@glouton-postgres:5432/glouton
      ENCRYPTION_SECRET: ${ENCRYPTION_SECRET:?Set ENCRYPTION_SECRET to a stable random value}
      REDIS_HOST: glouton-redis
      REDIS_PORT: 6379
      REDIS_DB: 0
      OIDC_ISSUER: ${OIDC_ISSUER:-}
      OIDC_CLIENT_ID: ${OIDC_CLIENT_ID:-}
      OIDC_CLIENT_SECRET: ${OIDC_CLIENT_SECRET:-}
      OIDC_REDIRECT_URL: ${OIDC_REDIRECT_URL:-}
      OIDC_SUCCESS_URL: ${OIDC_SUCCESS_URL:-}
      COURRIER_URL: ${COURRIER_URL:-}
      COURRIER_AUDIENCE: ${COURRIER_AUDIENCE:-}
      BULLE_URL: ${BULLE_URL:-}
      ARDOISE_URL: ${ARDOISE_URL:-}
      ARDOISE_API_TOKEN: ${ARDOISE_API_TOKEN:-}
      ARDOISE_WEBHOOK_SECRET: ${ARDOISE_WEBHOOK_SECRET:-}
      ARDOISE_DEFAULT_OWNER_EMAIL: ${ARDOISE_DEFAULT_OWNER_EMAIL:-}
      ARDOISE_WEB_URL: ${ARDOISE_WEB_URL:-}
      MCP_CONFIRM_KEY: ${MCP_CONFIRM_KEY:-}
      PARALLEL_API_KEY: ${PARALLEL_API_KEY:-}
      SONAR_BRAVE_KEY: ${SONAR_BRAVE_KEY:-}
      SONAR_TAVILY_KEY: ${SONAR_TAVILY_KEY:-}
      SONAR_EXA_KEY: ${SONAR_EXA_KEY:-}
      SONAR_FIRECRAWL_KEY: ${SONAR_FIRECRAWL_KEY:-}
      SONAR_BROWSERBASE_KEY: ${SONAR_BROWSERBASE_KEY:-}
      SONAR_BRIGHTDATA_KEY: ${SONAR_BRIGHTDATA_KEY:-}
      SONAR_BRIGHTDATA_ZONE: ${SONAR_BRIGHTDATA_ZONE:-}
      SONAR_LINKUP_KEY: ${SONAR_LINKUP_KEY:-}
      WEBSEARCH_DAILY_QUOTA: ${WEBSEARCH_DAILY_QUOTA:-}
      WEBSEARCH_DAILY_FETCH_QUOTA: ${WEBSEARCH_DAILY_FETCH_QUOTA:-}
    depends_on:
      glouton-postgres:
        condition: service_healthy
      glouton-redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "bun -e \"fetch('http://localhost:3001/health/ready').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))\""]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
      start_interval: 1s
    restart: unless-stopped

  glouton-frontend:
    build:
      context: .
      dockerfile: apps/frontend/Dockerfile
    container_name: glouton-frontend
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 3000
      DOMAIN: ${DOMAIN:?Set DOMAIN to your public URL, for example https://glouton.facile.studio}
      BACKEND_URL: http://glouton-backend:3001
    expose:
      - "3000"
    depends_on:
      glouton-backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "bun -e \"fetch('http://localhost:3000/').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))\""]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
      start_interval: 1s
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
