services:
  postgres:
    image: postgres:16-alpine
    container_name: glouton-postgres
    environment:
      POSTGRES_USER: glouton
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-glouton}
      POSTGRES_DB: glouton
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U glouton -d glouton"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: glouton-redis
    command: redis-server --appendonly yes --maxmemory-policy noeviction
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  backend:
    build:
      context: .
      dockerfile: apps/backend/Dockerfile
      network: host
      args:
        DATABASE_URL: postgresql://glouton:${POSTGRES_PASSWORD:-glouton}@postgres:5432/glouton
        CACHE_BUST: ${CACHE_BUST:-2026-05-15-1}
    container_name: glouton-backend
    environment:
      NODE_ENV: production
      PORT: 3001
      DOMAIN: ${DOMAIN:?Set DOMAIN to your public URL, for example https://glouton.facile.studio}
      DATABASE_URL: postgresql://glouton:${POSTGRES_PASSWORD:-glouton}@postgres:5432/glouton
      ENCRYPTION_SECRET: ${ENCRYPTION_SECRET:?Set ENCRYPTION_SECRET to a stable random value}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_DB: 0
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "bun -e \"fetch('http://localhost:3001/health/ready').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))\""]
      interval: 15s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: apps/frontend/Dockerfile
      network: host
    container_name: glouton-frontend
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 3000
      DOMAIN: ${DOMAIN:?Set DOMAIN to your public URL, for example https://glouton.facile.studio}
      BACKEND_URL: http://backend:3001
    expose:
      - "3000"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "bun -e \"fetch('http://localhost:3000/').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))\""]
      interval: 15s
      timeout: 5s
      retries: 10
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
